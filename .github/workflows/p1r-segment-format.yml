name: P1R Segment Format

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p1r-segment-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/presentation/PerimeterTimeline.tsx tests/e2e.spec.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/presentation/PerimeterTimeline.tsx tests/e2e.spec.ts
          git commit -m "style(p1r): format perimeter segment changes"
          git push
