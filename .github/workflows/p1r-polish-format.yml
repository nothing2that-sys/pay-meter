name: P1R Polish Format

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p1r-polish-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/App.tsx src/presentation/MoneyTimer.tsx src/styles.css
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/presentation/MoneyTimer.tsx src/styles.css
          git commit -m "style(p1r): format polished UI"
          git push
