name: P1R Final Format

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p1r-final-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/App.tsx src/presentation/CumulativeChart.tsx src/styles.css src/presentation/MoneyTimer.tsx src/presentation/FreeWorkWallet.tsx src/presentation/PerimeterTimeline.tsx src/presentation/moneyTimerViewModel.ts src/tests/prototype.test.ts tests/e2e.spec.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style(p1r): format final UI corrections"
          git push
