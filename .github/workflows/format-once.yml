name: Format Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore: run formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests public index.html package.json tsconfig.json vite.config.ts playwright.config.ts eslint.config.js .github/workflows/*.yml
          git commit -m "style: apply prettier formatting"
          git push origin HEAD:main
