name: Format Once
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted P1R source
        run: |
          rm .github/workflows/format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/format-once.yml
          git commit -m "style: format P1R implementation"
          git push
